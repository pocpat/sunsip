name: Deploy to Netlify

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Build project
      run: npm run build
      env:
        VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
        VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        VITE_OPENWEATHER_API_KEY: ${{ secrets.VITE_OPENWEATHER_API_KEY }}
        VITE_GEOCODING_API_KEY: ${{ secrets.VITE_GEOCODING_API_KEY }}
        VITE_IMAGEROUTER_API_KEY: ${{ secrets.VITE_IMAGEROUTER_API_KEY }}
        VITE_OPENROUTER_API_KEY: ${{ secrets.VITE_OPENROUTER_API_KEY }}
        VITE_OPENROUTER_TEXT_MODEL: ${{ secrets.VITE_OPENROUTER_TEXT_MODEL }}
        VITE_PEXELS_API_KEY: ${{ secrets.VITE_PEXELS_API_KEY }}
        VITE_PORTFOLIO_MODE_ENABLED: ${{ secrets.VITE_PORTFOLIO_MODE_ENABLED }}
        
    - name: Deploy to Netlify (site + functions)
      # The previous nwtgck/actions-netlify step deployed only dist/. Netlify's
      # own git integration ships functions, but this workflow's deploys must
      # too — netlify-cli deploys dist/ AND api/ functions per netlify.toml.
      run: npx --yes netlify-cli@latest deploy --prod --dir dist
      env:
        NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
      timeout-minutes: 10